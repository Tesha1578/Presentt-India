<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Floating glass cards + spark orb, thin line-art, one lime accent -->
  <g stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- back card -->
    <rect x="120" y="96" width="220" height="140" rx="24" opacity="0.55"/>
    <line x1="148" y1="132" x2="284" y2="132" opacity="0.5"/>
    <line x1="148" y1="160" x2="248" y2="160" opacity="0.35"/>
    <!-- front card -->
    <rect x="250" y="176" width="240" height="150" rx="24"/>
    <circle cx="290" cy="220" r="18"/>
    <line x1="322" y1="212" x2="452" y2="212"/>
    <line x1="322" y1="234" x2="412" y2="234" opacity="0.5"/>
    <line x1="278" y1="272" x2="452" y2="272" opacity="0.4"/>
    <line x1="278" y1="296" x2="392" y2="296" opacity="0.3"/>
    <!-- small chip card -->
    <rect x="86" y="252" width="130" height="66" rx="20" opacity="0.7"/>
    <line x1="110" y1="278" x2="192" y2="278" opacity="0.5"/>
    <line x1="110" y1="296" x2="164" y2="296" opacity="0.35"/>
    <!-- spark orb -->
    <circle cx="452" cy="92" r="26"/>
    <path d="M452 66 v-14 M452 132 v-12 M426 92 h-14 M492 92 h-12 M434 74 l-9 -9 M479 119 l-8 -8 M470 74 l9 -9 M425 119 l8 -8" opacity="0.7"/>
    <!-- float dashes -->
    <path d="M180 300 q10 14 0 28" opacity="0.4"/>
    <path d="M510 190 q12 10 6 26" opacity="0.4"/>
  </g>
  <!-- single lime accent line: orbit stroke through the spark orb -->
  <path d="M396 118 C420 84 470 74 506 96" stroke="#C6FF33" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="506" cy="96" r="4" fill="#C6FF33"/>
</svg>
